name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # nécessaire pour publier l'APK sur une release (tag v*)

jobs:
  quality:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère android/ si le repo ne le versionne pas.
      - name: Generate platform folders
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name shop_app --org com.example --platforms=android
          fi
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Static analysis (zero warnings)
        run: flutter analyze

      - name: Unit + widget tests
        run: flutter test --coverage

      - name: Integration tests
        run: flutter test integration_test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-apk:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name shop_app --org com.example --platforms=android
          fi
          rm -f test/widget_test.dart

      # flutter_secure_storage exige minSdk 23.
      - name: Set minSdk 23
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?( =|) *flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done

      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: shop-app-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
